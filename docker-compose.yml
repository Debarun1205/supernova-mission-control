version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: mission_control_db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mission-control
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mission_control_server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/mission-control
      USE_MEMORY_DB: "false"
      CLIENT_ORIGIN: "*"
    depends_on:
      - mongodb

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: mission_control_client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
