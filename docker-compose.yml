version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/mission-control
      - CLIENT_ORIGIN=http://localhost:5173
      - AI_API_KEY=
      - AI_MODEL=gemini-2.5-flash
      - USE_MEMORY_DB=false
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
